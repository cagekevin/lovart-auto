[package]
name = "lovart-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "lovart_client"
path = "src/lib.rs"

[[bin]]
name = "lovart-client"
path = "src/main.rs"

[build-dependencies]
# Tauri 的构建脚本：读 `tauri.conf.json`、把前端资源编进二进制、生成权限清单。
tauri-build = { version = "2", features = [] }

[dependencies]
# 协议层 + 调度层。**本 crate 只留 Tauri 适配与 CLI 入口**；
# 业务编排不许写在这里（第二入口 HTTP 拿不到窗口）。
lovart-core = { path = "../crates/lovart-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GUI 侧产 ISO 8601（`elapsed` 文案、状态时间戳），必须与 JS `toISOString()` 一致。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 只用于 CLI 的 SIGINT 处理（`run.rs`），一个 `signal()` 调用。
libc = "0.2"
# 本机 HTTP 接口（`src/http.rs`）：阻塞式、每请求一线程的极简服务器。
# 只监听 127.0.0.1，不做 TLS —— 它只服务同一台机器上的另一个进程。
tiny_http = "0.12"

# GUI 壳。**同一个二进制**：双击 = GUI，带子命令 = 无头 CLI。
# `protocol-asset` 是**必须的**：出图结果在本地盘上，前端要用 `<img>` 显示它们。
# 没有这个特性，Tauri 会拒绝 `asset:` 协议 ⇒ 所有缩略图和大图都是白板（且不报错）。
tauri = { version = "2", features = ["protocol-asset"] }
# 原生「选择文件」对话框：提示词文件**不限于** `inbox/` —— 用户想导哪份就导哪份。
# 用官方插件而不是自己调 Win32/rfd：跨平台行为一致（macOS 侧同一个二进制）。
tauri-plugin-dialog = "2"

[dev-dependencies]
# 集成测试（`tests/support/mod.rs`）起 mock HTTP 服务器用；运行时不使用。
# 运行时依赖已全部在 `lovart-core`，这里只为测试保留。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
